<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="lvGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="lvGradBookmark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Book base / left page -->
  <path d="M8 14
           C 8 12, 9 11, 11 11
           L 30 11
           C 31.1 11, 32 11.9, 32 13
           L 32 53
           C 32 53, 24 49, 11 49
           C 9 49, 8 48, 8 46
           Z"
        fill="url(#lvGrad)" opacity="0.95"/>

  <!-- Right page -->
  <path d="M56 14
           C 56 12, 55 11, 53 11
           L 34 11
           C 32.9 11, 32 11.9, 32 13
           L 32 53
           C 32 53, 40 49, 53 49
           C 55 49, 56 48, 56 46
           Z"
        fill="url(#lvGrad)"/>

  <!-- Page lines (left) -->
  <line x1="13" y1="20" x2="28" y2="20" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="13" y1="26" x2="26" y2="26" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.65"/>
  <line x1="13" y1="32" x2="28" y2="32" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>

  <!-- Page lines (right) -->
  <line x1="36" y1="20" x2="51" y2="20" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="36" y1="26" x2="49" y2="26" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.65"/>
  <line x1="36" y1="32" x2="51" y2="32" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>

  <!-- Spine highlight -->
  <line x1="32" y1="13" x2="32" y2="51" stroke="white" stroke-width="0.8" opacity="0.4"/>

  <!-- Bookmark ribbon -->
  <path d="M42 11 L42 27 L46 23 L50 27 L50 11 Z"
        fill="url(#lvGradBookmark)"/>
</svg>
